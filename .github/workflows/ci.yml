name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Audit dependencies
        run: npm audit --omit=dev

      - name: Run offline tests
        run: npm test

  # 真实联调只在手动触发和合入 main 后跑，不作为 PR 的门禁：
  # 它依赖真实模型与免费层配额，模型偶尔不服从指令、上游瞬时限流或断流都会
  # 让结果不稳定。PR 用离线测试保证质量，live 作为 main 上的健康检查。
  live-test:
    needs: static-checks
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      OC2API_LIVE_TEST: "1"
      API_KEY: ${{ secrets.API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run live upstream tests
        run: npm run test:live
